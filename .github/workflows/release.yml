name: Release

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0 && git push origin v1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See docs/RELEASE.md"; exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Tolerate CRLF/spaces and certutil's -----BEGIN/END----- lines
          printf '%s' "$KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64. Re-create it as described in docs/RELEASE.md"; exit 1; }
          # A real keystore starts with 0xFEEDFEED (JKS) or 0x30 (PKCS12)
          head -c 4 "$RUNNER_TEMP/release.jks" | xxd -p | grep -qiE '^(feedfeed|30)' \
            || { echo "::error::Decoded file is not a keystore. Did you encode release.jks?"; exit 1; }

      - name: Verify keystore, alias and passwords
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is empty or missing"; exit 1; }
          done
          # 1) keystore password
          if ! keytool -list -keystore "$KS" -storepass:env KEYSTORE_PASSWORD > "$RUNNER_TEMP/kt.txt" 2>&1; then
            echo "::error::KEYSTORE_PASSWORD is wrong (cannot open the keystore)."; exit 1
          fi
          # 2) alias (case-sensitive; keytool prints aliases lowercased, so compare case-insensitively)
          if ! grep -qiE "^${KEY_ALIAS},[[:space:]]" "$RUNNER_TEMP/kt.txt"; then
            echo "::error::KEY_ALIAS does not match any alias in the keystore. Aliases found (names only):"
            grep -E ', (PrivateKeyEntry|trustedCertEntry|SecretKeyEntry)' "$RUNNER_TEMP/kt.txt" | cut -d, -f1
            exit 1
          fi
          # 3) key password
          if grep -qi "Keystore type: PKCS12" "$RUNNER_TEMP/kt.txt"; then
            # PKCS12 keystores use one password for store and key
            if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
              echo "::error::KEY_PASSWORD must equal KEYSTORE_PASSWORD for a PKCS12 keystore."; exit 1
            fi
          else
            cp "$KS" "$RUNNER_TEMP/check.jks"
            if ! keytool -keypasswd -keystore "$RUNNER_TEMP/check.jks" -storepass:env KEYSTORE_PASSWORD \
                   -alias "$KEY_ALIAS" -keypass:env KEY_PASSWORD -new "$KEY_PASSWORD" >/dev/null 2>&1; then
              echo "::error::KEY_PASSWORD is wrong for this alias."; exit 1
            fi
          fi
          rm -f "$RUNNER_TEMP/check.jks" "$RUNNER_TEMP/kt.txt"
          echo "Keystore, alias and passwords look good."

      - name: Build signed release APK + AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: snake-cross-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
