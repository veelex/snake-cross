name: Release

on:
  push:
    tags: ["v*"]        # e.g. git tag v1.0 && git push origin v1.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. See docs/RELEASE.md"; exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Tolerate CRLF/spaces and certutil's -----BEGIN/END----- lines
          printf '%s' "$KEYSTORE_BASE64" | grep -v -- '-----' | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 is not valid base64. Re-create it as described in docs/RELEASE.md"; exit 1; }
          # A real keystore starts with 0xFEEDFEED (JKS) or 0x30 (PKCS12)
          head -c 4 "$RUNNER_TEMP/release.jks" | xxd -p | grep -qiE '^(feedfeed|30)' \
            || { echo "::error::Decoded file is not a keystore. Did you encode release.jks?"; exit 1; }

      - name: Build signed release APK + AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: snake-cross-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
